<!doctype html><html><head><meta charset="utf-8"><title>Car Calculator capture canvas</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F6F5F0}iframe{border:0;transform-origin:0 0;display:block}</style></head><body><iframe style="color-scheme:light" id="app" title="Car Calculator"></iframe><script>const p=new URLSearchParams(location.search),pad=p.get('device')==='ipad';const f=document.querySelector('iframe');f.style.width=(pad?1032:440)+'px';f.style.height=(pad?1376:956)+'px';f.style.transform='scale('+(pad?2/1.1:2/1.1)+')';f.src=p.get('route')||'/';</script></body></html>
